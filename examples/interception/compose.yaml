services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      S3_BUCKET: ${S3_BUCKET:-gha-cache}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8333/)\" = 403"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    networks:
      - cache

  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: gha-cache-proxy:interception
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_URL: ${PUBLIC_URL:-https://artifactcache.actions.githubusercontent.com}
      AUTH_TOKEN: ${CACHE_PROXY_AUTH_TOKEN:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-gha-cache}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      MAX_CACHE_SIZE_BYTES: ${MAX_CACHE_SIZE_BYTES:-10737418240}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      cache:
        aliases:
          - gha-cache-proxy

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      CACHE_PROXY_AUTH_TOKEN: ${CACHE_PROXY_AUTH_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      proxy:
        condition: service_started
    networks:
      cache:
        aliases:
          - artifactcache.actions.githubusercontent.com
          - results-receiver.actions.githubusercontent.com

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: gha-cache-interception-runner:2.336.0
    environment:
      RUNNER_URL: ${RUNNER_URL:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-gha-cache-interception}
      RUNNER_LABELS: ${RUNNER_LABELS:-gha-cache-interception}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
    volumes:
      - caddy-data:/caddy-data:ro
    depends_on:
      caddy:
        condition: service_started
      proxy:
        condition: service_started
    networks:
      - cache
    restart: "no"

volumes:
  seaweedfs-data:
  caddy-data:
  caddy-config:

networks:
  cache:
