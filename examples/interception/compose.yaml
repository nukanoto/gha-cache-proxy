services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-key}
      S3_BUCKET: ${S3_BUCKET:-gha-cache}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8333/)\" = 403"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    networks:
      - cache

  gha-cache-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: gha-cache-server:interception
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://artifactcache.actions.githubusercontent.com}
      TLS_LISTEN_ADDR: 0.0.0.0:443
      TLS_CA_CERT_OUT: /runner-ca/root.crt
      TLS_DATA_DIR: /var/lib/gha-cache-server/tls
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-gha-cache}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-key}
      MAX_TOTAL_CACHE_SIZE_BYTES: ${MAX_TOTAL_CACHE_SIZE_BYTES:-21474836480}
    volumes:
      - cache-tls:/var/lib/gha-cache-server/tls
      - runner-ca:/runner-ca
    healthcheck:
      test: ["CMD", "gha-cache-server", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 3s
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      cache:
        aliases:
          - artifactcache.actions.githubusercontent.com
          - results-receiver.actions.githubusercontent.com

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: gha-cache-interception-runner:2.338.2
    environment:
      - RUNNER_URL
      - RUNNER_TOKEN
      - RUNNER_NAME
      - RUNNER_LABELS
    volumes:
      - runner-ca:/runner-ca:ro
    depends_on:
      gha-cache-server:
        condition: service_healthy
    networks:
      - cache
    restart: "no"

volumes:
  seaweedfs-data:
  cache-tls:
  runner-ca:

networks:
  cache:
