# Local single-replica deployment for gha-cache-proxy (see docs/deployment.md).
# Every interpolation is optional (${VAR:-default}) so `docker compose config`
# works without any host environment setup. Defaults target local validation
# only; production values are set by overriding the same variables.
#
# The proxy connects exclusively to the MinIO service below and never to
# GitHub or any external API.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl ships in the pinned MinIO image; /bin/sh in CMD-SHELL has no /dev/tcp.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc mb --ignore-existing local/gha-cache"]

  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      AUTH_TOKEN: ${AUTH_TOKEN:-dev-secret-token}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-local-dev}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gha-cache
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Local test limit: the smoke script uploads 11 MiB to prove rejection.
      # Production should override this with the real limit (default 10 GiB).
      MAX_CACHE_SIZE_BYTES: ${MAX_CACHE_SIZE_BYTES:-10485760}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  minio-data:
